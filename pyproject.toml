[project]
name = "joblens"
version = "1.0.0"
description = "JobLens Extract: fine-tuned small open-weight model vs large model for structured job-posting extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "datasketch==2.0.0",
    "httpx==0.28.1",
    "huggingface-hub==2.4.0",
    "jsonschema==4.26.0",
    "jupytext==1.19.6",
    "matplotlib==3.11.2",
    "mlflow==3.17.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "scipy==1.18.1",
    "selectolax==1.0.2",
    "streamlit==1.66.1",
    "tenacity==9.2.1",
    "tokenizers==0.23.3",
    "transformers==5.22.1",
    "typer==0.27.3",
]

[project.scripts]
joblens = "joblens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joblens"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-jsonschema==4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/joblens/prompts.py" = ["E501"]
"notebooks/py/*" = ["E501", "E402"]  # prompt text lines are kept verbatim

[tool.mypy]
python_version = "3.12"
files = ["src/joblens"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["datasketch.*", "selectolax.*", "streamlit.*", "mlflow.*", "transformers.*", "unsloth.*", "trl.*", "peft.*", "datasets.*", "vllm.*", "torch.*", "matplotlib.*", "scipy.*", "huggingface_hub.*", "jupytext.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/joblens"]
omit = ["src/joblens/kaggle/*", "src/joblens/review_app.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
